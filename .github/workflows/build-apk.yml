name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Build Flutter APK
        run: |
          if [ ! -d "lib" ]; then
            cd ..
            flutter create temp_project --platforms=android --org com.iraq.volleyball --project-name volleyball_iraq
            shopt -s dotglob
            cp -r temp_project/* ./
            rm -rf temp_project
          else
            flutter pub get
          fi
          
          flutter build apk --release

      - name: Prepare APK for Download
        run: |
          mkdir -p my_apk
          cp build/app/outputs/flutter-apk/app-release.apk my_apk/volleyball-iraq.apk
          ls -la my_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volleyball-iraq-apk
          path: my_apk/volleyball-iraq.apk
