name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Ultimate Build Fix
        run: |
          # الاحتفاظ بمجلد lib الخاص بك إن وجد، وإلا سنستخدم هيكل نظيف
          echo "جاري تجهيز بيئة البناء..."
          
          # إذا لم يكن هناك مجلد lib رئيسي، سنقوم بإنشاء مشروع جديد كلياً بالاسم الصحيح
          if [ ! -d "lib" ]; then
            cd ..
            flutter create temp_project --platforms=android --org com.iraq.volleyball --project-name volleyball_iraq
            # نقل محتويات المشروع الجديد إلى المستودع الحالي
            shopt -s dotglob
            cp -r temp_project/* ./
            rm -rf temp_project
          else
            flutter pub get
          fi
          
          # بناء ملف الـ APK النهائي
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
