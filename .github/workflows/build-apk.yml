name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Build APK File
        run: |
          # البحث عن المسار الذي يحتوي على مجلد lib/main.dart الحقيقي
          MAIN_PATH=$(find . -path "*/lib/main.dart" -not -path "*/.*" | head -n 1)
          if [ -n "$MAIN_PATH" ]; then
            TARGET_DIR=$(dirname $(dirname "$MAIN_PATH"))
            echo "تم العثور على التطبيق الرئيسي في: $TARGET_DIR"
            cd "$TARGET_DIR"
            flutter pub get
            flutter build apk --release
          else
            echo "لم يتم العثور على main.dart"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
            **/build/app/outputs/apk/release/app-release.apk
