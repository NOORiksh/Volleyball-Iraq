name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Ultimate Build Fix
        run: |
          if [ ! -d "lib" ]; then
            cd ..
            flutter create temp_project --platforms=android --org com.iraq.volleyball --project-name volleyball_iraq
            shopt -s dotglob
            cp -r temp_project/* ./
            rm -rf temp_project
          else
            flutter pub get
          fi
          
          flutter build apk --release

      - name: Locate and Copy APK
        run: |
          mkdir -p final_apk_folder
          find . -name "*.apk" -exec cp {} final_apk_folder/ \;
          echo "تم العثور على الملفات التالية:"
          ls -la final_apk_folder/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: final_apk_folder/*.apk
